name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-${{ github.repository }}
      cancel-in-progress: true
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Verify site
        run: node scripts/check-site.mjs

      - name: Build combined docs reader
        run: node scripts/build-docs-reader.mjs

      - name: Assert reader is not empty
        run: node -e "const h=require('fs').readFileSync('dist/docs/read/index.html','utf8'); if(!h.includes('reader__section')||!h.includes('cloudflare workers')){console.error('reader empty');process.exit(3)} console.log('reader ok')"

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
